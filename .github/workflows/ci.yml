name: Tests

# The game is a single static file with no build step, so CI just runs the
# browser-driven suites against index.html.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest: that moved to Ubuntu 26.04, which the
    # pinned Playwright 1.56.1 cannot install Chromium on. Bump both together.
    runs-on: ubuntu-24.04
    # The suites take about three minutes; this is a backstop so a hung browser
    # can never sit on a runner for the default six hours.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # No package-lock.json is committed yet (the registry was unreachable from
      # the environment this was set up in), so `npm install` is used rather than
      # `npm ci`. The Playwright version is pinned exactly in package.json to keep
      # this reproducible; commit a lockfile and switch to `npm ci` when you can.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # No --with-deps: the ubuntu-24.04 image already ships every library
      # Chromium needs, and --with-deps only added nine optional font packages
      # from the runner's apt mirrors. When those mirrors stop resolving, that
      # step hung until the job timed out without running a test. Leaving it
      # out means the install only downloads the browser itself. That download
      # is retried, and only setup is retried, never the tests.
      - name: Install the Chromium browser Playwright drives
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install chromium && exit 0
            echo "Browser download failed (attempt $attempt of 3); retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Run the test suites
        run: npm test
