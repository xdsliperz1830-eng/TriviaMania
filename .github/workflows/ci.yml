name: Tests

# The game is a single static file with no build step, so CI just runs the
# browser-driven suites against index.html.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest: that moved to Ubuntu 26.04, which the
    # pinned Playwright 1.56.1 cannot install Chromium on. Bump both together.
    runs-on: ubuntu-24.04
    # The suites take about three minutes; this is a backstop so a hung browser
    # can never sit on a runner for the default six hours.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # package-lock.json pins Playwright and its one dependency exactly, so every
      # run installs the same versions.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # No --with-deps: the ubuntu-24.04 image already ships every library
      # Chromium needs, and --with-deps only added nine optional font packages
      # from the runner's apt mirrors. When those mirrors stop resolving, that
      # step hung until the job timed out without running a test. Leaving it
      # out means the install only downloads the browser itself. That download
      # is retried, and only setup is retried, never the tests.
      - name: Install the Chromium browser Playwright drives
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install chromium && exit 0
            echo "Browser download failed (attempt $attempt of 3); retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Run the test suites
        run: npm test

  reddit:
    # The Reddit version (reddit/): builds the web view from index.html, type
    # checks, runs the server tests against an in-memory Redis, then plays the
    # built game in Chromium against the real server code.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # Node 22.6+ runs the TypeScript tests directly (--experimental-strip-types).
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The root install provides Playwright for the browser test.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix reddit

      - name: Install the Chromium browser Playwright drives
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install chromium && exit 0
            echo "Browser download failed (attempt $attempt of 3); retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build and test the Reddit app
        run: npm test --prefix reddit

  android:
    # The Android version (android/): pacing and platform tests, the game in
    # Chromium with a fake ad service, then a debug APK build, kept as a
    # download on the run's page (it shows Google's test ads).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix android

      - name: Install the Chromium browser Playwright drives
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install chromium && exit 0
            echo "Browser download failed (attempt $attempt of 3); retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Test the Android build
        run: npm test --prefix android

      - name: Install Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build the debug APK
        working-directory: android/app
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-blast-debug-apk
          path: android/app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
